# Compatibility data for documentation renderers that consume docs/_data.
# Derived from model-catalog/models/; keep it in sync with that tree:
# - training and inference: the model has a training or an inference file.
# - examples: the runnable examples the catalog supports for the model AND whose
#   renderer resolves. A workflow is listed only when its catalog files exist
#   (conversational-sft needs a training file, inference-endpoint an inference
#   file, math-grpo a training and an inference file of the same context,
#   hardware and mode) and recommended_renderer_name(model, enable_thinking=False)
#   resolves with the pinned tinker_cookbook. A model whose renderer does not
#   resolve gets no example entries.
# - last_validated: the latest date in the model's model.json, or null.
models:
  - id: deepseek-ai/DeepSeek-V4.1-Flash-1017
    training: true
    inference: true
    examples:
