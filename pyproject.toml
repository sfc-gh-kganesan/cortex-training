[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-training"
version = "0.0.2"
description = "Python SDK and command-line tools for Cortex Training"
readme = "README.md"
# 3.10 is the real floor: torch, safetensors and tenacity all require >=3.10,
# and the package uses PEP 604 (`X | None`) annotations at runtime.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.28.0",
    "tenacity>=8.2.0",
    "boto3",
    "torch",
    "safetensors",
    "textual>=0.50"
]

[project.scripts]
cortex-training = "cortex_training.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cortex_training*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
