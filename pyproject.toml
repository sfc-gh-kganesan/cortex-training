[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-training"
version = "0.0.3"
description = "Python SDK and command-line tools for Cortex Training"
readme = "README.md"
# 3.10 is the real floor: torch, safetensors and tenacity all require >=3.10,
# and the package uses PEP 604 (`X | None`) annotations at runtime.
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "requests>=2.28.0",
    "tenacity>=8.2.0",
    "snowflake-connector-python>=3.17.0,<5",
    "torch",
    # cortex_training.wire uses safetensors.torch, which imports numpy, and
    # calls Tensor.numpy() directly; the [torch] extra is what declares numpy.
    "safetensors[torch]",
    # The TUI is tested on this Textual and relies on its behavior (keep
    # cortex_training/tui/__main__.py's TEXTUAL_FLOOR in step).
    "textual>=8.2.8,<9",
    "pydantic>=2.0.0"
]

[project.scripts]
cortex-training = "cortex_training.cli:main"
ct = "cortex_training.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cortex_training*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
